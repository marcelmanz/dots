# vim: set ft=toml:

# More info at: ./foot.ini.template
# or https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

# shell=fish
# shell=bash
# shell=/usr/bin/nu # This creates issues

# font=JetBrainsMono Nerd Font:size=10


[cursor]
style=block
# color=4b4b46 020221

[colors-dark]
background=151515
jump-labels=000000 ffff00
search-box-match=000000 ffff00

[colors-light]
background=e0e4de
foreground=2c2e33

regular0=2c2e33
regular1=700015
regular2=006d3f
regular3=b58900
regular4=350775
regular5=600051
regular6=007f86
regular7=d2d5db

bright0=64666c
bright1=ffaaa7
bright2=80ffb8
bright3=e6ed62
bright4=c2b3ff
bright5=ffb2f2
bright6=72f6ff
bright7=f3f7f1

# regular3 raised to b58900 (Solarized yellow) so the built-in
# jump-labels default (regular0 regular3) is already readable.
# Override below pins max contrast: pure black on pure yellow.
jump-labels=000000 ffff00
search-box-match=000000 ffff00
urls=350775

[main]
initial-color-theme=light
pad=15x10 center
font=Myna:size=10
# multi-extraction=true # still in development
# font=BlexMono Nerd Font:size=10
# font=Px437 NEC APC3 8x16:size=10
# font=AcPlus ToshibaSat 8x14:size=12
# font=Iosevka Term Nerd Font Mono:size=11

[scrollback]
indicator-position=none
# search-mode=regex

[regex:hashes]
regex=([a-fA-f0-9]{7,128})
launch= ${match}

[regex:paths]
regex=(\./[^ ]+|\.\./[^ ]+|/[^ ]+|~/[^ ]+)
launch=${match}

[regex:urls]
regex=([A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+)
launch=${match}


[key-bindings]
regex-copy=[paths] Control+Shift+p
regex-copy=[urls] Control+Shift+y
show-urls-launch=Control+Shift+o

