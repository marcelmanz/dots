$mainMod = Alt # Sets "Windows" key as main modifier

env = PATH,$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:/usr/bin
env = HYPRLAND_EGL_NO_MODIFIERS,1

exec-once = uwsm finalize WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE

# windowrulev2 = bordercolor rgba(F6D86Aff) rgba(7F6318ff), tag:locked
windowrulev = bordercolor rgb(FFFFFF), fullscreen 1
bind = $mainMod, TAB, exec, ~/scripts/hyprland/toggle-lock-window.sh
