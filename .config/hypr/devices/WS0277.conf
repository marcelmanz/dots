$mainMod = Alt # Sets "Windows" key as main modifier

env = PATH,$HOME/.nix-profile/bin:/run/current-system/sw/bin:/usr/bin

windowrulev2 = bordercolor rgba(F6D86Aff) rgba(7F6318ff), tag:locked
windowrulev2 = bordercolor rgb(FFFFFF), fullscreen:1
bind = $mainMod, TAB, exec, ~/scripts/hyprland/toggle-lock-window.sh
