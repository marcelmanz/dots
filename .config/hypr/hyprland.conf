# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

$mainMod = Alt # Sets "Windows" key as main modifier

env  = QT_QPA_PLATFORMTHEME,qt6ct  # for Qt apps
env = QT_SCALE_FACTOR,0.9  # UI scaling for sharp rendering at scale 2

# Create symlink to hostname-specific config (devices/nixos.conf, devices/work-laptop.conf, etc)
exec-once = ln -sf ~/.config/hypr/devices/$(hostname).conf ~/.config/hypr/device.conf
source = ~/.config/hypr/device.conf

# unsure about this 
# env = XDG_DATA_DIRS,$HOME/.nix-profile/share:/nix/var/nix/profiles/default/share:/usr/share/ubuntu:/usr/local/share:/usr/share:/var/lib/snapd/desktop

env = XDG_CURRENT_DESKTOP,Hyprland
env = EDITOR,nvim
env = VISUAL,nvim
env = SUDO_EDITOR,nvim
env = TERMINAL,foot
# env = XCURSOR_THEME,Retrosmart
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DPI_ADJUST,0.9  # Firefox UI scaling for sharp rendering at scale 2
env = XCURSOR_THEME,retrosmart-xcursor-white
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,retrosmart-xcursor-white
env = HYPRCURSOR_SIZE,32
# env = WLR_DRM_NO_MODIFIERS,1

workspace = 1,name:browse
workspace = 2,name:code
workspace = 3,name:learn

