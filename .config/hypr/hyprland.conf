#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = swayosd-server &
# exec-once = $terminal
# exec-once = ~/.config/eww/scripts/monitor.sh
# exec = ~/.config/eww/scripts/start.sh
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec = pkill waybar; waybar &
# exec-once = eww deamon
# exec-once = ~/.config/eww/launch.sh
exec-once = batsignal -b -w 20 -c 7 -d 5
exec-once = ydotool &
exec-once = pypr
# exec-once = pypr --debug /tmp/pypr.log
exec-once = hyprpaper &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = mako
exec-once = kanshi
# exec = kanshictl reload
exec-once = sh -c "mkfifo $XDG_RUNTIME_DIR/wob-volume.sock && tail -f $XDG_RUNTIME_DIR/wob-volume.sock | wob -c ~/.config/wob/wob-volume.ini"
exec-once = sh -c "mkfifo $XDG_RUNTIME_DIR/wob-brightness.sock && tail -f $XDG_RUNTIME_DIR/wob-brightness.sock | wob -c ~/.config/wob/wob-brightness.ini"
# Dark theme
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Flat-Remix-GTK-Blue-Dark'
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface cursor-theme retrosmart-xcursor-white
exec = gsettings set org.gnome.desktop.interface cursor-size 24

# UI scaling for sharp rendering at scale 2
exec = gsettings set org.gnome.desktop.interface text-scaling-factor 0.9




