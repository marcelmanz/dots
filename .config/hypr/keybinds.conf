# vi: ft=hyprlang
####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$menu = tofi-drun
$mainMod = ALT # Sets "Windows" key as main modifier
$altMod = SUPER # Sets "Windows" key as main modifier
# $mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, Return, exec, ~/scripts/hyprland/toggle-fullscreen.sh 'alacritty -e fish'
# bind = $mainMod, Return, exec, ~/scripts/hyprland/toggle-fullscreen.sh 'foot -e nu'
bind = $mainMod, Return, exec, 'foot'
workspace = special:scratchpad, on-created-empty:foot

bind = $mainMod, n, togglespecialworkspace, magic
# bind = $mainMod, e, exec, ~/.config/eww/toggle-bar.sh
bind = $mainMod, e, exec, pkill -USR1 waybar
# bind = $mainMod SHIFT, m, exec, ~/scripts/wl-mirror-menu.sh
# bind = $mainMod SHIFT, P, exec, ~/scripts/pdf-selector.sh
bind = $mainMod SHIFT, P, exec, passmenu
bind = $mainMod, M, exec, ~/scripts/video-selector.sh
bind = $mainMod SHIFT, M, exec, ~/scripts/video-selector.sh --dirs
# bind = $mainMod SHIFT, # bind = $mainMod SHIFT, S, movetoworkspace, special:magic
# bind = $mainMod SHIFT, n, exec, [workspace special term; float; move 25% 25%; size 50% 50%] foot

# bind = $mainMod, Return, exec, $terminal
# bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, Q, exec, ~/scripts/hyprland/safe-killactive.sh
# bind = $mainMod, M, exit,
# bind = $mainMod, M, exec, $fileManager
bind = $mainMod, Q, exec, firefox
bind = $mainMod, W, exec, firefox 'ext+container:name=Work&url=https://kagi.com'
bind = $mainMod SHIFT, E, exec, wofi-emoji
bind = $mainMod, Z, exec, pypr zoom ++0.5
bind = $mainMod SHIFT, W, exec, pypr shift_monitors +1
# bind = $mainMod SHIFT, I, exec, pypr shift_monitors -1
bind = $mainMod SHIFT, Z, exec, pypr zoom
# bind = $mainMod SHIFT, N, exec, foot --title "nnn-term" -e nnn
bind = $mainMod SHIFT, N, exec, swaync-client -t
windowrule = float on, match:title ^(nnn-term)$
# bind = $mainMod SHIFT, W, exec, pypr toggle whats
bind = $mainMod SHIFT, V, exec, pypr toggle volume

# disable for digital detox
# bind = $mainMod SHIFT, W, exec, whatsie
# bind = $mainMod SHIFT, W, exec, flatpak run com.rtosta.zapzap 

# firefox kiosk programs
bind = $mainMod SHIFT, O, exec, firefox https://ai.marcel.cool
# bind = $mainMod SHIFT, G, exec, firefox https://gemini.google.com/u/1/app
bind = $mainMod SHIFT, G, exec, firefox "ext+container:name=Work&url=https://gemini.google.com/u/1/app"
bind = $mainMod SHIFT, D, exec, firefox https://excalidraw.com

# firefox kiosk-like but not compositor fullscreen
# windowrule = match:class firefox, float
# windowrule = match:class firefox, size 1280 800
# windowrule = match:class firefox, move 320 140
# windowrule = match:class firefox, fullscreenstate:0 0


# bind = $mainMod SHIFT, G, exec, viagee
bind = $mainMod, V, togglefloating, 
bind = $mainMod, V, exec, hyprctl dispatch centerwindow
# bind = $mainMod, V, resizeactive, exact 800 500
# bind = $mainMod, V, moveactive, exact 370 150
bind = $mainMod SHIFT, C, exec, ~/scripts/script-selector.sh --tofi
bind = $mainMod, C, exec, pkill tofi || cliphist list | tofi --fuzzy-match=true | cliphist decode | wl-copy
bind = $mainMod, D, exec, $menu
# bind = $mainMod SHIFT, D, exec, dmenu-wl_run -m $(hyprctl -j monitors | jq '.[] | select(.focused==true) | .id')
bind = $mainMod, P, exec, ~/scripts/tofi/power-selector.sh
# bind = $mainMod, P, pseudo, # dwindle

# bind = $mainMod, F, exec, hyprctl dispatch fullscreen 1 && hyprctl dispatch submap fs
#
# submap = fs
# bind = $mainMod, J, cyclenext
# bind = $mainMod, K, cyclenext, prev
# bind = $mainMod, F, exec, hyprctl dispatch fullscreen 1 && hyprctl dispatch submap reset
# bind = , escape, submap, reset
# submap = reset

bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
# bind = $mainMod, E, togglesplit, # dwindle
# bind = $mainMod, E, layoutmsg, orientationcycle # master
# bind = $mainMod,  PRINT, exec, $HOME/scripts/hyprland/region-screenshot.sh
bind = $mainMod, PRINT, exec,  grim -g "$(slurp)" - | swappy -f -
# bind = $mainMod, PRINT, exec,  $HOME/scripts/hyprland/native-scale-screenshot.sh
# bind = $mainMod, PRINT, exec, hyprshot -m region -m active 
# bind = $mainMod, PRINT, exec, hyprshot -m region 
bind = $mainMod SHIFT, S, exec, $HOME/scripts/hyprland/qr-code-reader.sh
bind = $mainMod SHIFT, R, exec, hyprctl reload && pypr reload
bind = $mainMod SHIFT, X, exec, hyprctl kill
bind = $mainMod, S, exec, pypr toggle term

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d 

bind = $mainMod, E, layoutmsg, orientationnext

bind = ALT, R, submap, resize
# will start a submap called "resize"
submap = resize
bind = , l, resizeactive, 50 0
bind = , h, resizeactive, -50 0
bind = , k, resizeactive, 0 -50
bind = , j, resizeactive, 0 50
# use reset to go back to the global submap
bind = , escape, submap, reset 
# will reset the submap, meaning end the current one and return to the global one
submap = reset

bind = $altMod, l, resizeactive, 50 0
bind = $altMod, h, resizeactive, -50 0
bind = $altMod, k, resizeactive, 0 -50
bind = $altMod, j, resizeactive, 0 50

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# bind = $mainMod, o, exec, $HOME/scripts/hyprland/reorder-workspaces.sh

# F keys
# bind = F1, , exec, foot

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, B, exec, $HOME/scripts/bluetooth-selector.sh
# bind = $mainMod SHIFT, W, exec, $HOME/scripts/show_webcam.sh

# Lock on lid open
bindl=,switch:on:Lid Switch, exec, hyprlock --immediate
# Lock lid on close
bindl=,switch:off:Lid Switch, exec, hyprlock --immediate

# Simple volume keybinds
# binde = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%-
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+ 
# binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# SwayOSD volume keybinds
# binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
# binde = , XF86AudioLowerVolume, exec, exec  swayosd-client --output-volume lower
# binde = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
# binde = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Pulseaudio volume keybinds
binde = , XF86AudioRaiseVolume, exec, $HOME/scripts/volume-control.sh up
binde = , XF86AudioLowerVolume, exec, $HOME/scripts/volume-control.sh down
binde = , XF86AudioMute,        exec, pamixer -t && ([ "$(pamixer --get-mute)" = "true" ] && echo 0 > $XDG_RUNTIME_DIR/wob-volume.sock || pamixer --get-volume > $XDG_RUNTIME_DIR/wob-volume.sock) && pkill -RTMIN+11 waybar
binde = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle && pkill -RTMIN+11 waybar

bind = $mainMod, TAB, exec, ~/scripts/hyprland/toggle-lock-window.sh

# Pipewire/Wireplumber volume keybinds
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.25 @DEFAULT_AUDIO_SINK@ 5%+
# binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# binde = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# binde = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# brightnessctl keybinds
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%- && brightnessctl -m | cut -d, -f4 | tr -d '%' > $XDG_RUNTIME_DIR/wob-brightness.sock
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5% && brightnessctl -m | cut -d, -f4 | tr -d '%' > $XDG_RUNTIME_DIR/wob-brightness.sock
