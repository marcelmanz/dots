[pyprland]
plugins = [
    "expose",
    "fetch_client_menu",
    "lost_windows",
    "magnify",
    "scratchpads",
    "shift_monitors",
    "toggle_special",
    # "workspaces_follow_focus",
]


# Base configuration for the scratchpad plugin
# [scratchpads.name]
# command = "command to run"
# class = "the window's class"  # check: hyprctl clients | grep class
# size = "<width> <height>"  # size of the window relative to the screen size

[scratchpads.term]
animation = ""
class = "bash"
command = "foot -a bash -L bash"
size = "75% 40%"
lazy = true

# [scratchpads.whats]
# animation = ""
# command = "flatpak run com.rtosta.zapzap"
# class = "com.rtosta.zapzap"
# size = "70% 80%"
# # size = "99% 97%"
# # position = "0% 3%"
# lazy = true

[scratchpads.volume]
animation = ""
command = "pavucontrol"
class = "Pavucontrol"
position = "5% 5%"
size = "90% 90%"
unfocus = "hide"
lazy = true

[scratchpads.kitty]
animation = "fromTop"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
size = "75% 60%"
max_size = "1920px 100%"
margin = 50

