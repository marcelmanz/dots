[pyprland]
plugins = [
    "expose",
    "fetch_client_menu",
    "lost_windows",
    "magnify",
    "scratchpads",
    "shift_monitors",
    "toggle_special",
    "workspaces_follow_focus",
]


# [scratchpads.term]
