[scratchpads.term]
animation = ""
class = "nu"
command = "foot -a nu -L nu"
size = "75% 40%"
lazy = true

[scratchpads.whats]
animation = ""
command = "wasistlos %u"
class = "wasistlos"
size = "70% 80%"
lazy = true
