name = "main"
anchor_to_edges = true
position = "bottom"
height = 30
exclusive_zone = false
ironvar_defaults = { touchpad = "󰤳" }

[[start]]
type = "custom"
name = "ostui"
bar = [
    { type = "button", label = "󰝚", on_click = "!~/scripts/hyprland/music-toggle.sh" },
]

[[start]]
type = "custom"
name = "music"
on_click_middle = "~/scripts/hyprland/media-module play-pause"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/media-module watch}}", on_click = "!~/scripts/hyprland/media-module toggle" },
]

[[start]]
type = "custom"
name = "touchpad"
bar = [
    { type = "button", label = "#touchpad", on_click = "!~/scripts/hyprland/toggle-touchpad.sh" },
]

[[start]]
type = "custom"
name = "nixbuild"
bar = [
    { type = "button", label = "", on_click = "!~/scripts/hyprland/nixbuild toggle" },
]

[[start]]
type = "custom"
name = "projectw"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/projectw.sh}}", on_click = "!~/scripts/hyprland/projectw.sh toggle" },
]

[[start]]
type = "custom"
name = "keyboard-layout"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/keyboard-layout.sh}}", on_click = "!hyprctl switchxkblayout all next" },
]

[[center]]
type = "focused"
show_icon = false
truncate = { mode = "end", max_length = 40 }

[[end]]
type = "sys_info"
name = "cpu"
format = ["CPU {cpu_percent}%"]
interval.cpu = 2
on_click_left = "alacritty -e s-tui"

[[end]]
type = "sys_info"
name = "ram"
format = ["RAM {memory_percent}%"]
interval.memory = 5
on_click_left = "alacritty -e btm --default_widget_type mem --expanded"

[[end]]
type = "volume"
format = "{icon} {percentage}%"
max_volume = 100
on_click_left = "pypr toggle volume"

[end.icons]
volume_high = "󰕾"
volume_medium = "󰖀"
volume_low = "󰕿"
muted = "󰝟"

[[end]]
type = "network_manager"
icon_size = 24
types_whitelist = ["wifi"]

[[end]]
type = "custom"
name = "vpn"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/vpn.sh}}", on_click = "!~/scripts/hyprland/vpn.sh toggle" },
]

[[end]]
type = "custom"
class = "bluetooth"
bar = [
    { type = "button", label = "󰂯", on_click = "!alacritty -e bluetuith" },
]

# [[end]]
# type = "network_manager"
# icon_size = 24
# types_whitelist = ["wifi"]

[[end]]
type = "battery"
format = "{percentage}%"
icon_size = 24

[end.profiles.warning]
percent = 30

[end.profiles.critical]
when = { percent = 15, charging = false }

[[end]]
type = "clock"

[[end]]
type = "custom"
class = "notifications"
on_click_right = "~/scripts/hyprland/notifications dnd"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/notifications watch}}", on_click = "!~/scripts/hyprland/notifications toggle" },
]

[[end]]
type = "tray"
icon_size = 22

