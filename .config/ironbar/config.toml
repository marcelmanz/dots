name = "main"
anchor_to_edges = true
position = "top"
height = 30

[[start]]
type = "workspaces"
all_monitors = false

[[start]]
type = "focused"
show_icon = false
truncate = "end"


[[end]]
type = "volume"
format = "{icon} {percentage}%"
max_volume = 100

[end.icons]
volume_high = "󰕾"
volume_medium = "󰖀"
volume_low = "󰕿"
muted = "󰝟"

[[end]]
type = "network_manager"
icon_size = 28
types_whitelist = ["wifi"]

[[end]]
type = "battery"
format = "{percentage}%"
icon_size = 28

[end.profiles.warning]
percent = 30

[end.profiles.critical]
when = { percent = 15, charging = false }

[[end]]
type = "clock"

[[end]]
type = "notifications"
show_count = true

[[end]]
type = "tray"
icon_size = 28

