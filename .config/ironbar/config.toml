name = "main"
anchor_to_edges = true
position = "bottom"
height = 30
exclusive_zone = false
ironvar_defaults = { touchpad = "󰤳" }

[[start]]
type = "workspaces"
all_monitors = false
sort = "index"
hidden = [
    "special:scratchpad",
    "special:S-cinny",
    "special:S-term",
    "special:S-quick_notes",
    "special:S-volume",
    "special:S-kitty",
]

[[center]]
type = "focused"
show_icon = false
truncate = "end"


[[end]]
type = "custom"
name = "touchpad"
bar = [
    { type = "button", label = "#touchpad", on_click = "!~/scripts/hyprland/toggle-touchpad.sh" },
]

[[end]]
type = "custom"
name = "keyboard-layout"
bar = [
    { type = "button", label = "{{watch:~/scripts/hyprland/keyboard-layout.sh}}", on_click = "!hyprctl switchxkblayout all next" },
]

[[end]]
type = "volume"
format = "{icon} {percentage}%"
max_volume = 100
on_click_left = "pypr toggle volume"

[end.icons]
volume_high = "󰕾"
volume_medium = "󰖀"
volume_low = "󰕿"
muted = "󰝟"

[[end]]
type = "network_manager"
icon_size = 24
types_whitelist = ["wifi"]

[[end]]
type = "custom"
class = "bluetooth"
bar = [
    { type = "button", label = "󰂯", on_click = "!foot -e bluetuith" },
]

# [[end]]
# type = "network_manager"
# icon_size = 24
# types_whitelist = ["wifi"]

[[end]]
type = "battery"
format = "{percentage}%"
icon_size = 24

[end.profiles.warning]
percent = 30

[end.profiles.critical]
when = { percent = 15, charging = false }

[[end]]
type = "clock"

[[end]]
type = "notifications"
show_count = false

[[end]]
type = "tray"
icon_size = 22

