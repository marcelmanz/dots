setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/clones/own/dots/.config/tmux/plugins/"

# bind-key Space send-prefix
bind-key C-b send-prefix
set -sg escape-time 5
set-option -g focus-events on
set-option -g base-index 1
set-option -g history-limit 50000
set-option -g prefix C-b
# set-option repeat-time 0 setw -g aggressive-resize on unbind-key C-b

# Enable custom pane navigation and resizing
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind C-z resize-pane -Z

bind [ previous-layout
bind ] next-layout

# Copy mode
bind-key y copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

bind Enter new-window -c '#{pane_current_path}' 'bash'
bind p previous-window
bind n next-window

bind J switch-client -n
bind K switch-client -p
# copy mode using 'y'
# unbind [
# bind-key -T copy-mode-vi v send-keys -X begin-selection

# start selection with 'space' and copy using 'y'
# unbind-key -T copy-mode-vi Enter
# bind-key -T copy-mode-vi y send-keys -X copy-selection

# paste using 'p'
# unbind p
# bind p paste-buffer

# set-option -g default-shell 'fish'
# set-option -g default-shell 'bash'
# set-option -g default-shell "/etc/profiles/per-user/$USER/bin/bash"
# set-option -g default-command "/etc/profiles/per-user/$USER/bin/bash --login -i"

set-option -g detach-on-destroy off

set -g set-clipboard off
set -g message-command-style "fg=colour154,bg=colour0"
set -g message-style "fg=colour154,bg=colour0"
set -g mouse on
set -g status "on"
# set -g status-justify "left"
# set -g status-left-length "100"
set -g status-left-length 200
# set -g status-right-length "100"
set -g status-right-length 200
# setw -g window-status-separator ""
bind v split-window -h -c '#{pane_current_path}' 'bash'
bind s split-window -v -c '#{pane_current_path}' 'bash'
bind V split-window -f -h -c '#{pane_current_path}' 'bash'
bind S split-window -f -v -c '#{pane_current_path}' 'bash' bind n split-window -f -v -c '#{pane_current_path}' 'bash'
# select-layout even-vertical and even-horizontal
bind = select-layout even-vertical 
# bind K confirm-before -p "Are you sure you want to kill the session? (y/n)" kill-session
bind m run-shell "~/scripts/tofi/kill-tmux-session.sh"
bind M split-window -v -c "#{pane_current_path}" "~/scripts/makefile-runner.sh"
# bind c new-window -c '#{pane_current_path}'
# bind-key c new-window -c '#{pane_current_path}' 'bash'
bind-key c split-window -b -l 25 -c '#{pane_current_path}' 'bash'
# bind-key c run-shell 'if tmux list-windows -F "#{window_name}" | grep -q ":nu$"; then tmux select-window -t $(tmux list-windows -F "#{window_name}" | grep ":nu$" | cut -d: -f1); else tmux new-window -c "#{pane_current_path}" -n "nu" "nu"; fi'
bind-key R source-file $HOME/.config/tmux/tmux.conf \; display-message "$HOME/.config/tmux/tmux.conf reloaded"
# bind S switch-client -l

# bind J display-popup -E "\
# tmux list-panes -a -F '#{?session_attached,,#S:#I.#P}' |\
# sed '/^$/d' |\
# fzf --reverse --header join-pane --preview 'tmux capture-pane -pt {}'  |\
# xargs tmux join-pane -v -s"

# bind-key M split-window -h -c '#{pane_current_path}' \
#     'bash -c "ls *.md | entr -c glow (ls *.md | fzf)"'; \
#     last-window;

# set -g status-bg colour0
# set -g status-fg colour154
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g renumber-windows on
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

bind f run-shell "~/scripts/tmux/session-finder.sh"



# bind-key -T edit-mode-vi Up send-keys -X history-up
# bind-key -T edit-mode-vi Down send-keys -X history-down
# unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
# unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
# unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# unbind-key -T copy-mode-vi [         ;   bind-key -T copy-mode-vi [ send-keys -X begin-selection
# unbind-key -T copy-mode-vi ]         ;   bind-key -T copy-mode-vi ] send-keys -X copy-selection

set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-urlview'
# set -g @plugin 'ofirgall/tmux-window-name' # this should go before tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'marcelarie/extrakto'

set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#698DDA"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator-str "  tmux  "
set -g @minimal-tmux-indicator false
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-window-status-format ""

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon " 󰊓 "

# on all tabs (default is false)
# false will make it visible for the current tab only
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true

# To add or remove extra text in status bar
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra ""

# Not recommended to change these values
set -g @minimal-tmux-status-right "#[fg=#A6E3A1]#(printf '%%s' '#{pane_current_path}' | sed \"s|^$HOME|~|\")#[default] #(~/clones/own/dots/.config/tmux/scripts/get_dir_branch '#{pane_current_path}' --tmux)"
set -g @minimal-tmux-status-left "#[fg=#F9E2AF,bold]#S#[default] #(~/clones/own/dots/.config/tmux/scripts/window-pane-list.sh)"
set -g @minimal-tmux-window-status-format ''

set -g @extrakto_filter_order "path word all line"

# extrakto bindings
bind-key u run-shell "${TMUX_PLUGIN_MANAGER_PATH}extrakto/scripts/open.sh \"#{pane_id}\" url"
bind-key P run-shell "${TMUX_PLUGIN_MANAGER_PATH}extrakto/scripts/open.sh \"#{pane_id}\" path"

# If getting strings cut in left status or right
# Here 20 is the length of the characters in the string
# set -g status-left-right 20
# set -g status-left-length 20

# run-shell ~/.config/tmux/plugins/tmux-urlview/urlview.tmux

# Clone TPM on first run, then install any plugins you’ve listed
if-shell '[ ! -d "$TMUX_PLUGIN_MANAGER_PATH/tpm" ]' \
  "run 'git clone https://github.com/tmux-plugins/tpm \"$TMUX_PLUGIN_MANAGER_PATH/tpm\" \
   && \"$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins\"'"

run "$HOME/clones/own/dots/.config/tmux/plugins/tpm/tpm"

# Override window status formats after plugins load
set-option -g window-status-current-format ""
set-option -g window-status-format ""
set-option -g status-interval 1

# Refresh status bar immediately on pane/window changes
set-hook -g after-split-window 'refresh-client -S'
set-hook -g after-kill-pane 'refresh-client -S'
set-hook -g after-new-window 'refresh-client -S'
set-hook -g after-select-pane 'refresh-client -S'
set-hook -g pane-exited 'refresh-client -S'

# Remove pane borders
set-option -g pane-border-status off
set-option -g pane-border-style fg=colour0
set-option -g pane-active-border-style fg=colour0
