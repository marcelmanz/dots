set-window-option -g mode-keys vi
# colour3 / yellow (#676900, dark olive) is the default Search bg — looks brown on light.
# Override with yellow_bg (#e6ed62) which is the proper light-theme bg variant.
set-window-option -g mode-style "bg=#e6ed62,fg=#2c2e33"

# Ensure interactive shells get proper initialization
set-option -g default-command "bash"
bind-key e new-window "nvim"
